x-api: &default-api
  image: ghcr.io/openimis/openimis-be:${BE_TAG:-develop}
  environment:
    - DB_DEFAULT=${DB_DEFAULT:-postgresql}
    - DB_HOST=${DB_HOST}
    - DB_PORT=${DB_PORT}
    - DB_NAME=${DB_NAME}
    - DB_USER=${DB_USER}
    - DB_PASSWORD=${DB_PASSWORD}
    - SECRET_KEY=${SECRET_KEY}
    - SITE_ROOT=api
    - SITE_URL=${DOMAIN}
    - CELERY_BROKER_URL=amqp://rabbitmq
    - MODE=${MODE:-Prod}
    - HOSTS=${HOSTS}
    - CACHE_BACKEND=${CACHE_BACKEND}
    - CACHE_URL=${CACHE_URL}
    - CACHE_OPTIONS=${CACHE_OPTIONS}
    - OPENSEARCH_ADMIN=${OPENSEARCH_ADMIN}
    - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
    - OPENSEARCH_HOSTS=${OPENSEARCH_HOSTS}
  volumes:
    - photos:/openimis-be/openIMIS/images/insurees
   # - ./be.openimis.json:/openimis-be/openimis.json
  depends_on:
    db:
      condition: service_healthy
  networks:
    openimis-net:

services:
  db:
    image: ghcr.io/openimis/openimis-pgsql:${DB_TAG:-latest}
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - DEMO_DATASET=${DEMO_DATASET}
      - DB_ENGINE=django.db.backends.postgresql
    healthcheck:
      test: pg_isready -U ${DB_USER} -d ${DB_NAME}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database:/var/lib/postgresql/data
    restart: always
    networks:
      openimis-net:
  frontend:
    image: ghcr.io/openimis/openimis-fe:${FE_TAG:-develop}
    restart: always
    environment:
      - REACT_APP_API_URL=api
      - NEW_OPENIMIS_HOST=${DOMAIN}
      - OPENIMIS_CONF_JSON=${OPENIMIS_FE_CONF_JSON}
      - OPENSEARCH_BASIC_TOKEN=${OPENSEARCH_BASIC_TOKEN}
    networks: 
      openimis-net:
    depends_on:
      - backend
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      # - ./fe.openimis.json:/app/openimis.json
      # comment the following line if you are using your own gateway
      # - ./conf/nginx:/conf/
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    labels:
      - traefik.enable=true
      - traefik.http.routers.${PROJECT_NAME}.rule=Host("${DOMAIN}")
      - traefik.http.routers.${PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${PROJECT_NAME}.tls=true
      - traefik.docker.network=proxy
      - traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=80

      - ./conf/nginx:/conf/
  migrations:
    <<: *default-api
    command: init
    restart: no
  backend:
    <<: *default-api
    command: start
    restart: always
    depends_on:
      migrations:
        condition: service_completed_successfully   
  worker:
    <<: *default-api
    command: worker
    restart: always
    depends_on:
      migrations:
        condition: service_completed_successfully
    #pâs compatible 
    #deploy:
    #  mode: replicated
    #  replicas: ${WORKER_REPLICAS:-3}
  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    networks:
      openimis-net:
  opensearch:
    image: opensearchproject/opensearch:latest
    env_file:
      - ".env.openSearch"
    environment:
      - "discovery.type=${DISCOVERY_TYPE:-single-node}"
      - "cluster.name=${CLUSTER_NAME:-my_opensearch_local}"
      - "http.port=${OPEN_SEARCH_HTTP_PORT:-9200}"
      - "plugins.security.ssl.http.enabled=${SLL_HTTP_ENABLED:-false}"
      - "plugins.security.disabled=true"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - "opensearch-data1:/usr/share/opensearch/data"
    networks:
      openimis-net:
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.9.0
    environment:
      - OPENSEARCH_HOSTS=${OPENSEARCH_HOSTS:-http://opensearch:9200}
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
      - SERVER_BASEPATH=/opensearch
      - SERVER_REWRITEBASEPATH=true
    volumes:
      - "./conf/opensearch/opensearch.yml:/usr/share/opensearch-dashboards/config/opensearch.yml"
    networks:
      openimis-net:


networks:
  openimis-net: 
    name: coolify
    external: true
volumes:
  database:
  photos:
  opensearch-data1: